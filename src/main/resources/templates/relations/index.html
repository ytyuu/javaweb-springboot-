<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国人物关系选择</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .button-group button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .button-group button.selected {
            background-color: #007bff;
            color: white;
        }
        .selected-buttons {
            margin-bottom: 20px;
        }
        .selected-buttons span {
            margin-right: 10px;
        }
        form {
            display: flex;
            justify-content: center;
        }
        form button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
        }
        #status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        #network-graph {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>请选择你感兴趣的三国人物</h1>
        <div class="button-group">
            <button data-name="刘备">刘备</button>
            <button data-name="关羽">关羽</button>
            <button data-name="张飞">张飞</button>
            <button data-name="诸葛亮">诸葛亮</button>
            <button data-name="赵云">赵云</button>
            <button data-name="曹操">曹操</button>
            <button data-name="司马懿">司马懿</button>
            <button data-name="张辽">张辽</button>
            <button data-name="张郃">张郃</button>
            <button data-name="夏侯渊">夏侯渊</button>
            <button data-name="夏侯惇">夏侯惇</button>
            <button data-name="孙策">孙策</button>
            <button data-name="孙权">孙权</button>
            <button data-name="周瑜">周瑜</button>
            <button data-name="袁绍">袁绍</button>
            <button data-name="袁术">袁术</button>
            <button data-name="吕布">吕布</button>
            <button data-name="汉献帝">汉献帝</button>
            <button data-name="董卓">董卓</button>
        </div>
        <div class="selected-buttons">
            <strong>已选择：</strong>
            <span id="selected-buttons">(未选择)</span>
        </div>
        <form id="submit-form">
            <button type="submit">生成网络图</button>
        </form>
        <div id="status"></div>
        <div id="network-graph">
            <h2>人物关系网络图</h2>
            <iframe id="graph-frame" width="100%" height="800px" frameborder="0"></iframe>
        </div>
    </div>

    <script>
        // 获取按钮组和已选择显示区域
        const buttonGroup = document.querySelector('.button-group');
        const selectedButtonsDisplay = document.getElementById('selected-buttons');
        const submitForm = document.getElementById('submit-form');
        const statusDiv = document.getElementById('status');
        const networkGraphDiv = document.getElementById('network-graph');
        const graphFrame = document.getElementById('graph-frame');

        // 存储已选择的按钮名称
        let selectedButtons = [];

        // 添加按钮点击事件
        buttonGroup.addEventListener('click', (event) => {
            const button = event.target;
            if (button.tagName === 'BUTTON') {
                const name = button.getAttribute('data-name');
                if (selectedButtons.includes(name)) {
                    // 如果已选择，移除
                    selectedButtons = selectedButtons.filter(btn => btn !== name);
                    button.classList.remove('selected');
                } else {
                    // 如果未选择，添加
                    selectedButtons.push(name);
                    button.classList.add('selected');
                }
                // 更新已选择显示区域
                selectedButtonsDisplay.textContent = selectedButtons.length > 0 ? selectedButtons.join(', ') : '(未选择)';
            }
        });

        // 添加表单提交事件
        submitForm.addEventListener('submit', (event) => {
            event.preventDefault();

            if (selectedButtons.length === 0) {
                statusDiv.textContent = '请至少选择一个人物';
                statusDiv.className = 'error';
                return;
            }

            // 创建表单数据对象
            const formData = new FormData();
            formData.append('selectedButtons', selectedButtons.join(','));

            // 显示加载状态
            statusDiv.textContent = '正在生成网络图...';
            statusDiv.className = '';
            networkGraphDiv.style.display = 'none';

            // 发送POST请求
            fetch('/submit', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusDiv.innerHTML = data.message + ' <a href="/三國共現網絡.html" target="_blank">点击这里查看结果</a>';
                    statusDiv.className = 'success';
                    
                    // 设置iframe的源并显示
                    graphFrame.src = '/三國共現網絡.html';
                    networkGraphDiv.style.display = 'block';
                } else {
                    statusDiv.textContent = data.error || '生成失败';
                    statusDiv.className = 'error';
                }
            })
            .catch(error => {
                console.error('提交失败：', error);
                statusDiv.textContent = '提交失败，请重试';
                statusDiv.className = 'error';
            });
        });
    </script>
</body>
</html>
