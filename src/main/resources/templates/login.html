<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
</head>

<body>
  <form action="/login" method="post">   <!-- 关键：post + 指定数据传递的目标后端接口地址 -->
    <table border="1">
      <tr>
        <td>用户名:</td>
        <td>
          <input type="text" name="username" required>  <!-- name 必须和后端参数名一致 -->
        </td>
      </tr>
      <tr>
        <td>用户密码:</td>
        <td>
          <input type="password" name="password" required>  <!-- 用 password 类型 -->
        </td>
      </tr>
      <tr>
        <td colspan="2">
          <input type="submit" value="登录">
          <input type="reset" value="重置">
        </td>
      </tr>
    </table>
  </form>

</body>
</html>
